[package]
name = "coolwords_ui"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = { version = "0.8" }
leptos_router = { version = "0.8" }
leptos_meta = { version = "0.8" }
# Multipart codec for binary drag-drop uploads (MultipartData / MultipartFormData).
server_fn = { version = "0.8", features = ["multipart"] }
axum = { version = "0.8", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
leptos_axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "sync", "macros"], optional = true }
wasm-bindgen = { version = "=0.2.120", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
# web-sys features used by the import drop-zone + tag drag/confirm (client side).
web-sys = { version = "0.3", features = [
    "DragEvent", "DataTransfer", "File", "FileList", "FormData", "Blob",
    "HtmlInputElement", "Window", "Storage",
    # Ingress base recovery on the client: read <html data-base> and the page origin.
    "Document", "Element", "Location",
    # Touch-capable tag drag-and-drop (Pointer Events, hit-testing, edge autoscroll).
    "PointerEvent", "MouseEvent", "EventTarget", "HtmlElement",
] }

[features]
hydrate = ["leptos/hydrate", "dep:console_error_panic_hook", "dep:wasm-bindgen"]
ssr = [
    "dep:axum",
    "dep:tokio",
    "dep:leptos_axum",
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
    "dep:rusqlite",
    # web-sys is compiled for SSR too (event handlers in shared view code reference
    # it); wasm-bindgen's JsCast is needed there for pointer-capture casting.
    "dep:wasm-bindgen",
]

[package.metadata.leptos]
output-name = "coolwords_ui"
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "style/main.scss"
assets-dir = "public"
site-addr = "127.0.0.1:7575"
reload-port = 7576
browserquery = "defaults"
watch = false
env = "DEV"
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false

# Local dev builds (cargo leptos watch, i.e. run.bat) default to debug=true, which on
# Windows/MSVC emits .pdb symbol files next to the binaries. We don't debug through
# them, so turn debuginfo off — no more .pdb clutter. (Release/container build already
# has debug=false; this doesn't affect it.)
[profile.dev]
debug = false

[profile.wasm-release]
inherits = "release"
opt-level = 'z'
lto = true
codegen-units = 1
panic = "abort"
