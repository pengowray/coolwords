name: build add-on image

# Build the amd64 add-on image and push it to GHCR. The HA add-on (coolwords/config.yaml)
# pulls ghcr.io/<owner>/coolwords-amd64:<version>, so after a push: bump `version` in
# config.yaml and Home Assistant offers an Update that pulls the new image.
on:
  push:
    branches: [ main ]
    paths:
      - 'ui/**'
      - 'ingest/**'
      - 'schema/**'
      - 'coolwords/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image ref + version
        id: meta
        run: |
          version="$(grep -E '^version:' coolwords/config.yaml | head -1 | sed -E 's/version:\s*//; s/"//g' | tr -d '[:space:]')"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$owner/coolwords-amd64" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
