# Home Assistant add-on manifest. This add-on runs a PREBUILT image (the `image:`
# key), so the Supervisor pulls it from GHCR instead of compiling on the HAOS box.
# Update flow: bump `version` below to a tag the CI has pushed → HA shows "Update".
name: Coolwords
version: "0.1.0"
slug: coolwords
description: Find rare and interesting words in public-domain books (Leptos/axum + Python OCR).
url: https://github.com/pengowray/coolwords
# HAOS here is x86/64. Add aarch64 to this list (and the CI matrix) only if needed.
arch:
  - amd64
# {arch} is substituted by the Supervisor → ghcr.io/pengowray/coolwords-amd64:<version>.
image: ghcr.io/pengowray/coolwords-{arch}
# Single process (the server); we provide our own CMD, no s6 init needed.
init: false
host_network: false
ports:
  7575/tcp: 7575
ports_description:
  7575/tcp: Web UI (put a Cloudflare tunnel + Access in front for words.ffff.network)
# The databases, embeddings, and imported books live in /share (persist across
# updates); see DOCS.md for seeding them.
map:
  - share:rw
options:
  bind: 0.0.0.0:7575
schema:
  bind: str
webui: http://[HOST]:[PORT:7575]
